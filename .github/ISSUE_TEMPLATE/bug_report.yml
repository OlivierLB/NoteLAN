name: Bug report
description: Report a reproducible problem with NoteLAN.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve NoteLAN. Do not include private notes, IP addresses, URL tokens, or `data.json`.
  - type: input
    id: version
    attributes:
      label: NoteLAN version
      placeholder: 0.3.5
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version and operating system
      placeholder: Obsidian 1.x on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive example content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private notes, tokens, IP addresses, and personal analytics data.
          required: true
